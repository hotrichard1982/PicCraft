name: BMP 崩溃复现（临时，验证后删除）

on:
  workflow_dispatch:

jobs:
  repro-arm64:
    runs-on: macos-14
    steps:
      - name: arm64 原生复现（对照）
        run: |
          mkdir -p /tmp/r/src
          cat > /tmp/r/Cargo.toml <<'EOF'
          [package]
          name = "r"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          image = { version = "0.25.10", default-features = false, features = ["bmp", "png", "jpeg"] }
          EOF
          cat > /tmp/r/src/main.rs <<'EOF'
          use image::{DynamicImage, RgbaImage, Rgba};
          fn main() {
              let src = DynamicImage::ImageRgba8(RgbaImage::from_pixel(207, 90, Rgba([200,100,50,255])));
              // 批量路径：resize_exact 各种目标尺寸
              for (w, h) in [(207u32, 90u32), (100, 43), (300, 130), (200, 86), (150, 65), (1024, 445)] {
                  let r = src.resize_exact(w, h, image::imageops::FilterType::Lanczos3).save(format!("/tmp/out_{w}x{h}.bmp"));
                  println!("arm64 resize_exact {w}x{h}: {:?}", r.as_ref().map(|_| "ok"));
              }
              // 缩略图路径：resize 等比
              let r = src.resize(207, u32::MAX, image::imageops::FilterType::Triangle).save("/tmp/out_ratio.bmp");
              println!("arm64 resize_ratio: {:?}", r.as_ref().map(|_| "ok"));
              // crop / rotate / flip
              println!("arm64 crop: {:?}", src.crop_imm(10,10,100,50).save("/tmp/out_crop.bmp").as_ref().map(|_| "ok"));
              println!("arm64 rotate: {:?}", src.rotate90().save("/tmp/out_rot.bmp").as_ref().map(|_| "ok"));
              println!("arm64 flip: {:?}", src.fliph().save("/tmp/out_flip.bmp").as_ref().map(|_| "ok"));
              println!("arm64 DONE");
          }
          EOF
          cd /tmp/r && cargo run --quiet 2>&1 || true

  repro-x64:
    runs-on: macos-14
    steps:
      - name: 安装 Rosetta（运行 x64 二进制）
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          uname -m
      - name: x64 交叉编译复现
        run: |
          mkdir -p /tmp/r/src
          cat > /tmp/r/Cargo.toml <<'EOF'
          [package]
          name = "r"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          image = { version = "0.25.10", default-features = false, features = ["bmp", "png", "jpeg"] }
          EOF
          cat > /tmp/r/src/main.rs <<'EOF'
          use image::{DynamicImage, RgbaImage, Rgba};
          fn main() {
              let src = DynamicImage::ImageRgba8(RgbaImage::from_pixel(207, 90, Rgba([200,100,50,255])));
              for (w, h) in [(207u32, 90u32), (100, 43), (300, 130), (200, 86), (150, 65), (1024, 445)] {
                  let r = src.resize_exact(w, h, image::imageops::FilterType::Lanczos3).save(format!("/tmp/out_{w}x{h}.bmp"));
                  println!("x64 resize_exact {w}x{h}: {:?}", r.as_ref().map(|_| "ok"));
              }
              let r = src.resize(207, u32::MAX, image::imageops::FilterType::Triangle).save("/tmp/out_ratio.bmp");
              println!("x64 resize_ratio: {:?}", r.as_ref().map(|_| "ok"));
              println!("x64 crop: {:?}", src.crop_imm(10,10,100,50).save("/tmp/out_crop.bmp").as_ref().map(|_| "ok"));
              println!("x64 rotate: {:?}", src.rotate90().save("/tmp/out_rot.bmp").as_ref().map(|_| "ok"));
              println!("x64 flip: {:?}", src.fliph().save("/tmp/out_flip.bmp").as_ref().map(|_| "ok"));
              // DynamicImage::save（save_to_temp / save_image bmp 分支直接路径）
              println!("x64 dyn save: {:?}", src.save("/tmp/out_dyn.bmp").as_ref().map(|_| "ok"));
              println!("x64 DONE");
          }
          EOF
          cd /tmp/r && rustup target add x86_64-apple-darwin && cargo build --target x86_64-apple-darwin --quiet 2>&1 | tail -2
          # Rosetta 运行 x64 二进制（arch 检查确认）
          file target/x86_64-apple-darwin/debug/r
          ./target/x86_64-apple-darwin/debug/r 2>&1 || true
